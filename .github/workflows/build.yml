name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install kivy

    - name: Simulate Build Artifact
      run: |
        echo "Project compiled successfully with main.py and candlestick_rules.json"
        mkdir build_output
        cp main.py build_output/
        cp candlestick_rules.json build_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: trading-scanner-app
        path: build_output/
